<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunicati LACT</title>
<style>
:root{--b:#1d4f91;--b2:#0f3466;--bg:#dfe9f6;--ln:#b9cde6;--ink:#14253d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#c9dbf1,var(--bg) 260px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
body::before{content:"";position:fixed;inset:0;background:var(--wm) center 50%/min(70vw,540px) no-repeat;opacity:.13;mix-blend-mode:multiply;pointer-events:none}
.app{display:flex;gap:18px;max-width:1300px;margin:auto;padding:16px;position:relative}
aside{width:260px;flex:none;position:sticky;top:12px;align-self:flex-start;max-height:calc(100vh - 24px);overflow:auto;background:#ffffffd9;border:1px solid var(--ln);border-radius:12px;padding:12px}
aside h3{margin:14px 0 6px;font-size:13px;color:var(--b2)}aside small{display:block;color:#5b6f8a;margin-top:4px}
aside ol{margin:0 0 8px;padding-left:20px}aside li{margin:3px 0}aside li span{float:right}aside li a{color:var(--b);text-decoration:none}
main{flex:1;min-width:0}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--ln);background:#fff;color:var(--b2);border-radius:7px;padding:4px 9px;cursor:pointer;display:inline-block;margin:2px 2px 2px 0}
button:hover,.btn:hover{background:#eaf2fc}.big{width:100%;background:var(--b);color:#fff;font-size:15px;padding:9px;border:0}.big:hover{background:var(--b2)}
.drop{display:block;border:2px dashed #7fa4d6;border-radius:10px;padding:14px 8px;text-align:center;color:var(--b);cursor:pointer;margin-top:6px;font-size:13px}
select{width:100%;font:inherit;padding:4px;border-radius:6px;border:1px solid var(--ln)}#msg{font-size:12px;margin-top:6px;color:#205c2a}
.hd{display:flex;gap:16px;align-items:center;background:linear-gradient(100deg,var(--b2),var(--b));color:#fff;border-radius:14px;padding:16px 20px;position:relative}
.hd img{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.hd h1{margin:0;font:700 27px Georgia,"Times New Roman",serif;letter-spacing:.5px}.hd p{margin:3px 0 0}.hd .s{font-size:12px;opacity:.85}
.hd .pen{position:absolute;right:12px;top:12px}
.sec{margin-top:22px}.sec h2{font:600 21px Georgia,serif;color:var(--b2);border-left:6px solid var(--b);padding-left:10px;margin:0 0 10px;break-after:avoid}
.sec h2 .pen{margin-left:8px;vertical-align:middle}
.blk{background:#ffffffd1;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:12px;position:relative}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bt h3{margin:0;font-size:16px;color:var(--b)}
.tools{text-align:right}.blk>.tools{float:right}
.tw{overflow:auto;margin-top:6px}table{border-collapse:collapse;width:100%}
th{background:var(--b);color:#fff;text-align:left;padding:5px 9px;font-weight:600;font-size:13px}
td{padding:4px 9px;border-bottom:1px solid var(--ln)}tr{break-inside:avoid}tbody tr:nth-child(even){background:#1d4f9111}
th.n,td.n{text-align:center}.lg{height:22px;width:22px;object-fit:contain;vertical-align:middle;margin-right:7px}
.txt{min-height:1.4em}.txt p{margin:.4em 0}
[contenteditable=true]{outline:1px dashed #5b8dd0;background:#fff;border-radius:3px;min-width:1.6em;display:inline-block}.txt[contenteditable=true]{display:block;padding:6px}
th [contenteditable=true]{color:var(--ink)}
.add{margin-top:4px;color:#5b6f8a;font-size:13px}
.pen{border-radius:50%;width:28px;height:28px;padding:0;text-align:center}
.idx{display:none}.idx a{display:block;color:var(--b);text-decoration:none;font-weight:600}
dialog{border:1px solid var(--ln);border-radius:12px;max-width:560px;width:92%}.lgl>div{display:flex;align-items:center;gap:10px;margin:4px 0}.lgl span:nth-child(2){flex:1}
.lgi{width:30px;height:30px;border:1px solid var(--ln);border-radius:6px;display:inline-flex;align-items:center;justify-content:center}.lgi img{max-width:26px;max-height:26px}
@media(max-width:860px){.app{flex-wrap:wrap}aside{width:100%;position:static;max-height:none}}
@media print{@page{size:A4;margin:12mm}aside,.nt{display:none!important}.app{display:block;padding:0}.idx{display:block;background:#ffffffd1;border-radius:10px;padding:8px 14px;margin-top:14px}.idx h3{margin:0 0 4px;color:var(--b2)}.tw{overflow:visible}thead{display:table-header-group}.hd{break-after:avoid}}
</style></head><body>
<div class="app"><aside id="side"></aside><main><div id="doc"></div></main></div>
<dialog id="dlg"></dialog>

const teams=()=>{const m=new Set;S.secs.forEach(s=>s.blocks.forEach(b=>b.cols&&b.cols.forEach((c,j)=>c.team&&b.rows.forEach(r=>r[j]&&m.add(r[j])))));return[...m].sort()};
const rs=(f,m)=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,i.width*k|0);c.height=Math.max(1,i.height*k|0);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/png'))};i.src=fr.result};fr.readAsDataURL(f)});
const PRE={txt:()=>({t:'txt',html:'<p>Nuovo testo…</p>'}),
res:()=>({t:'tab',title:'Risultati giornata',cols:[{h:'Casa',team:1},{h:'Ris.',n:1},{h:'Ospite',team:1}],rows:[['','','']]}),
prog:()=>({t:'tab',title:'Programma gare',cols:[{h:'Campo'},{h:'Data',n:1},{h:'Casa',team:1},{h:'Ospite',team:1}],rows:[['','','','']]}),
tab:()=>({t:'tab',title:'Nuova tabella',cols:[{h:'Colonna 1'},{h:'Colonna 2'}],rows:[['','']]})};
const ce=o=>o?' contenteditable="true"':'',
pen=(i,o)=>`<button class="pen nt" data-a="pen" data-i="${i}" title="${o?'Fine modifica':'Modifica'}">${o?'✓':'✎'}</button>`;
function tools(s,b,e){let x='';if(e){x=`<button data-a="up" data-s="${s.id}" data-b="${b.id}" title="Sposta su">↑</button><button data-a="dn" data-s="${s.id}" data-b="${b.id}" title="Sposta giù">↓</button><button data-a="del" data-s="${s.id}" data-b="${b.id}" title="Elimina blocco">🗑</button>`;
x+=b.t=='tab'?`<button data-a="addrow" data-b="${b.id}">+ riga</button><button data-a="addcol" data-b="${b.id}">+ colonna</button><button data-a="delcol" data-b="${b.id}">− colonna</button>`:
`<button data-a="cmd" data-c="bold"><b>G</b></button><button data-a="cmd" data-c="italic"><i>C</i></button><button data-a="cmd" data-c="underline"><u>S</u></button><button data-a="cmd" data-c="insertUnorderedList">• elenco</button><button data-a="cmd" data-c="hiliteColor">evidenzia</button>`}
return`<div class="tools nt">${x}${pen(b.id,e)}</div>`}
function blk(s,b){const e=E[b.id];
if(b.t=='txt')return`<div class="blk">${tools(s,b,e)}<div class="txt f" data-b="${b.id}" data-bf="html"${ce(e)}>${b.html}</div></div>`;
return`<div class="blk"><div class="bt"><h3 data-b="${b.id}" data-bf="title"${ce(e)}>${esc(b.title)}</h3>${tools(s,b,e)}</div><div class="tw"><table><thead><tr>${b.cols.map((c,j)=>`<th class="${c.n?'n':''}"><span data-b="${b.id}" data-h="${j}"${ce(e)}>${esc(c.h)}</span></th>`).join('')}${e?'<th class="nt"></th>':''}</tr></thead><tbody>${b.rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td class="${b.cols[j].n?'n':''}">${b.cols[j].team&&lg(v)?`<img class="lg" src="${lg(v)}">`:''}<span data-b="${b.id}" data-r="${i}" data-c="${j}"${ce(e)}>${esc(v)}</span></td>`).join('')}${e?`<td class="nt"><button data-a="delrow" data-b="${b.id}" data-r="${i}" title="Elimina riga">×</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`}
function render(){const L=S.lega||LEGA;document.documentElement.style.setProperty('--wm','url("'+L+'")');
const F=k=>`<span data-f="${k}"${ce(E.hd)}>${esc(S[k])}</span>`;
$('#doc').innerHTML=`<header class="hd"><img src="${L}"><div><h1>LEGA AMATORI CALCIO TREVISO</h1><p class="s">Via Benzi 86 – Treviso · www.legaamatoricalciotreviso.it</p><p>Comunicato Ufficiale n. ${F('num')} emesso in data ${F('data')} – Stagione Sportiva ${F('stag')}</p></div>${pen('hd',E.hd)}</header>
<nav class="idx"><h3>Indice</h3>${S.secs.map((s,i)=>`<a href="#s-${s.id}">${i+1}. ${esc(s.title)}</a>`).join('')}</nav>`+
S.secs.map((s,i)=>`<section class="sec" id="s-${s.id}"><h2>${i+1}. <span data-s="${s.id}" data-sf="title"${ce(E[s.id])}>${esc(s.title)}</span>${pen(s.id,E[s.id])}</h2>${s.blocks.map(b=>blk(s,b)).join('')}<div class="add nt">+ Aggiungi qui: ${[['txt','Testo'],['res','Risultati'],['prog','Programma gare'],['tab','Tabella libera']].map(k=>`<button data-a="add" data-s="${s.id}" data-k="${k[0]}">${k[1]}</button>`).join('')}</div></section>`).join('');
$('#side').innerHTML=`<button class="big" data-a="pdf">⬇ Esporta PDF</button><small>Nella finestra che si apre scegli “Salva come PDF”.</small>
<h3>Indice (clicca per saltare)</h3><ol>${S.secs.map(s=>`<li><span><button data-a="secup" data-s="${s.id}">↑</button><button data-a="secdn" data-s="${s.id}">↓</button><button data-a="secdel" data-s="${s.id}">×</button></span><a href="#s-${s.id}">${esc(s.title)}</a></li>`).join('')}</ol><button data-a="addsec">+ Nuova sezione</button>
<h3>Importa da Excel</h3><select id="tg">${S.secs.map(s=>`<option value="${s.id}"${s.id==T?' selected':''}>${esc(s.title)}</option>`).join('')}</select>
<label class="drop" id="dz">Trascina qui o clicca per scegliere i file Excel<br>(classifica, marcatori, squalificati)<input id="xl" type="file" multiple accept=".xlsx" hidden></label><div id="msg">${esc(M)}</div>
<h3>Loghi</h3><button data-a="logos">Loghi delle squadre…</button><label class="btn">Logo della Lega<input id="lg0" type="file" accept="image/*" hidden></label>
<h3>Comunicato</h3><button data-a="new">Nuovo comunicato</button><button data-a="save">Salva file</button><label class="btn">Apri file<input id="op" type="file" accept=".json" hidden></label>`}
function dlg(){const D=$('#dlg');D.innerHTML=`<h3>Loghi delle squadre</h3><p>Più veloce: carica tutti i loghi insieme, con il file chiamato come la squadra (es. “Marca 96.png”).</p><label class="btn">Carica più loghi<input type="file" multiple accept="image/*" data-bulk="1" hidden></label><div class="lgl">${teams().map(t=>`<div><span class="lgi">${lg(t)?`<img src="${lg(t)}">`:''}</span><span>${esc(t)}</span><label class="btn">Scegli<input type="file" accept="image/*" data-t="${esc(t)}" hidden></label></div>`).join('')||'<i>Inserisci prima le squadre nelle tabelle.</i>'}</div><p><button onclick="this.closest('dialog').close()">Chiudi</button></p>`;if(!D.open)D.showModal()}
async function imp(files){const s=sec(T||S.secs[0]&&S.secs[0].id);if(!s)return msg('Crea prima una sezione.');const ok=[],ko=[];
for(const f of files){try{const R=(await xrows(await f.arrayBuffer())).map(r=>r.map(v=>String(v==null?'':v).trim())),hd=R[0].map(norm),D=R.slice(1).filter(r=>r.some(x=>x));let b;
if(hd.includes('punti'))b={title:'Classifica',cols:R[0].map((h,j)=>({h:h=='Punti'?'P.ti':h,team:j==0,n:j>0})),rows:D};
else if(hd.includes('golfatti'))b={title:'Classifica marcatori',cols:[{h:'Atleta'},{h:'Squadra',team:1},{h:'Gol',n:1}],rows:D.map(r=>[r[0],r[1],r[2]])};
else if(hd.includes('sanzione'))b={title:'Giocatori squalificati',cols:[{h:'Atleta'},{h:'Squadra',team:1},{h:'Sanzione'},{h:'Data'}],rows:D.map(r=>{const n=+r[3];return[r[0],r[1],(r[4]||'').replace(/[.\s]+$/,''),n>20000&&n<80000?fd(new Date(Math.round((n-25569)*864e5))):r[3]]})};
else throw 0;
b.t='tab';const x=s.blocks.find(k=>k.title==b.title);if(x)Object.assign(x,b);else{b.id=uid();s.blocks.push(b)}ok.push(b.title)}catch(x){ko.push(f.name)}}
save();render();msg((ok.length?'Inserito: '+ok.join(', ')+'. ':'')+(ko.length?'Non riconosciuto: '+ko.join(', '):''))}
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-a=cmd]'))e.preventDefault()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const d=t.dataset,a=d.a,s=sec(d.s),x=d.b&&fb(d.b),b=x&&x[1],si=S.secs.indexOf(s);
if(a=='cmd'){document.execCommand(d.c,false,d.c=='hiliteColor'?'#fff1a8':null);return}
if(a=='pdf'){document.title='Comunicato_Ufficiale_'+S.num+'_'+S.data;print();return}
if(a=='logos'){dlg();return}
if(a=='save'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='comunicato_'+S.num+'.json';l.click();return}
if(a=='pen')E[d.i]=!E[d.i];
else if(a=='up'||a=='dn')mv(s.blocks,s.blocks.indexOf(b),a=='up'?-1:1);
else if(a=='del'){if(!confirm('Eliminare questo blocco?'))return;s.blocks=s.blocks.filter(k=>k!=b)}
else if(a=='add'){const n=PRE[d.k]();n.id=uid();s.blocks.push(n);E[n.id]=1}
else if(a=='addsec'){const n={id:uid(),title:'Nuova sezione',blocks:[]};S.secs.push(n);E[n.id]=1}
else if(a=='secup'||a=='secdn')mv(S.secs,si,a=='secup'?-1:1);
else if(a=='secdel'){if(!confirm('Eliminare la sezione “'+s.title+'” con tutto il suo contenuto?'))return;S.secs.splice(si,1)}
else if(a=='addrow')b.rows.push(b.cols.map(()=>''));
else if(a=='delrow')b.rows.splice(+d.r,1);
else if(a=='addcol'){b.cols.push({h:'Colonna'});b.rows.forEach(r=>r.push(''))}
else if(a=='delcol'){if(b.cols.length>1){b.cols.pop();b.rows.forEach(r=>r.pop())}}
else if(a=='new'){if(!confirm('Iniziare un nuovo comunicato? Il contenuto attuale verrà svuotato (i loghi restano). Prima puoi usare “Salva file”.'))return;const n=DEF();n.logos=S.logos;n.lega=S.lega;n.num=String((+S.num||0)+1);n.stag=S.stag;S=n;E={}}
save();render()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.f)S[d.f]=t.textContent;else if(d.sf){sec(d.s).title=t.textContent}else if(d.bf)fb(d.b)[1][d.bf]=d.bf=='html'?t.innerHTML:t.textContent;else if(d.c!=null)fb(d.b)[1].rows[d.r][d.c]=t.textContent;else if(d.h!=null)fb(d.b)[1].cols[d.h].h=t.textContent;else return;save()});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.sf)render()});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key=='Enter'&&t.isContentEditable&&!t.classList.contains('txt')){e.preventDefault();t.blur()}});
document.addEventListener('paste',e=>{const t=e.target;if(t.isContentEditable&&!t.classList.contains('txt')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text').replace(/\s+/g,' '))}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();imp([...e.dataTransfer.files])}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset,f=t.files&&t.files[0];
if(t.id=='tg'){T=t.value;return}
if(!f)return;
if(t.id=='xl')await imp([...t.files]);
else if(t.id=='lg0'){S.lega=await rs(f,600);save();render()}
else if(t.id=='op'){const r=new FileReader;r.onload=()=>{try{S=JSON.parse(r.result);E={};save();render()}catch(x){msg('File non valido.')}};r.readAsText(f)}
else if(d.t||d.bulk){if(d.t)S.logos[norm(d.t)]=await rs(f,72);else for(const g of t.files)S.logos[norm(g.name.replace(/\.[^.]+$/,''))]=await rs(g,72);save();render();dlg()}
t.value=''});
render();
</script></body></html>
