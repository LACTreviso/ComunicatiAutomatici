<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunicati LACT</title>
<meta name="theme-color" content="#0f3466">
<style>
:root{--or:#d86400;--pbg:#e3eefa;--b:#1d4f91;--b2:#0f3466;--bg:#dfe9f6;--ln:#b9cde6;--ink:#14253d;--mut:#5b6f8a;--y:#fff1a0;--yb:#d9b400;--ok:#1f7a3a;--ko:#b3261e;--soft:#f3f7fd}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#c9dbf1,var(--bg) 260px) no-repeat,var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:100vh}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--ln);background:#fff;color:var(--b2);border-radius:7px;padding:4px 9px;cursor:pointer;display:inline-block;margin:2px 2px 2px 0;line-height:1.3}
button:hover,.btn:hover{background:#eaf2fc}button:disabled{opacity:.5;cursor:default}
.big{width:100%;background:var(--b);color:#fff;font-size:15px;padding:9px;border:0}.big:hover{background:var(--b2)}
.pri{background:var(--b);color:#fff;border-color:var(--b)}.pri:hover{background:var(--b2)}
.dang{color:var(--ko)}
input,select,textarea{font:inherit;font-size:14px;padding:5px 7px;border-radius:6px;border:1px solid var(--ln);background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;resize:vertical}
label.f{display:inline-flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;margin:0 8px 6px 0}
label.ck{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:0 10px 4px 0;cursor:pointer}
/* ---------- barra superiore ---------- */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(100deg,var(--b2),var(--b));color:#fff;box-shadow:0 2px 12px #0f346640;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.tabs{display:flex;gap:6px;margin-left:10px}
.tabs button{background:transparent;color:#e3edfa;border:1px solid #ffffff55;border-radius:999px;padding:6px 16px;font-size:14px;margin:0}
.tabs button:hover{background:#ffffff22}.tabs button.on{background:#fff;color:var(--b2);font-weight:600;border-color:#fff}
.tr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tr button{margin:0;background:#ffffff1f;color:#fff;border-color:#ffffff55}.tr button:hover{background:#ffffff38}
.tr button.pri{background:#fff;color:var(--b2);border-color:#fff;font-weight:600}
.chip{font-size:12px;border-radius:999px;padding:3px 10px;background:#ffffff26;border:1px solid #ffffff44;white-space:nowrap}
.view[hidden]{display:none!important}
/* ---------- scheda DATI ---------- */
.dv{max-width:1120px;margin:auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 18px;margin-bottom:18px;box-shadow:0 2px 10px #0f34660d}
.card>h2{margin:0 0 4px;font:600 20px Georgia,serif;color:var(--b2)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.guide div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px}.guide b{color:var(--b2)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ln);padding-bottom:10px;margin-bottom:10px}
.ch input.nm{font:600 19px Georgia,serif;color:var(--b2);border-color:transparent;padding:4px 6px;min-width:260px}
.ch input.nm:hover,.ch input.nm:focus{border-color:var(--ln)}
.ch .grow{flex:1}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.st{border-radius:10px;padding:8px 10px;font-size:12px;border:1px solid var(--ln);background:#fafcff}
.st b{display:block;font-size:13px}.st.ok{border-color:#9fd3ae;background:#effaf2}.st.ok b{color:var(--ok)}.st.ko b{color:var(--mut)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fbfdff}
.box h4{margin:0 0 6px;color:var(--b2);font-size:14px}
.box small,.hint{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.drop{display:block;border:2px dashed #7fa4d6;border-radius:10px;padding:16px 8px;text-align:center;color:var(--b);cursor:pointer;font-size:13px;background:#fff}
.drop:hover,.drop.ov{background:#eaf2fc}
.cmsg{font-size:12.5px;margin-top:8px;color:var(--ok);white-space:pre-line}.cmsg.err{color:var(--ko)}
details.prev{margin-top:12px}details.prev summary{cursor:pointer;color:var(--b);font-size:13px;font-weight:600}
details.prev .tw{max-height:260px;margin-bottom:8px}details.prev h5{margin:10px 0 2px;color:var(--b2)}
.empty-c{text-align:center;padding:26px;color:var(--mut)}
/* ---------- recuperi ---------- */
.recf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 8px;background:#fffbe0;border:1px solid #efd96a;border-radius:10px;padding:8px 10px}
.recf select.m{min-width:280px;max-width:100%}
.recl{list-style:none;margin:8px 0 0;padding:0}.recl li{display:flex;align-items:center;gap:8px;background:var(--y);border-radius:8px;padding:4px 8px;margin:4px 0;font-size:13px}
.recl li span{flex:1}
/* ---------- ② struttura ---------- */
.ct3{margin:0 0 10px;font:600 17px Georgia,serif;color:var(--b2)}.ct3 .hint{display:inline;font:400 12px "Segoe UI",sans-serif;margin-left:8px}
.hgrid{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start}
.hlogo{width:86px;height:86px;object-fit:contain;border-radius:50%;border:1px solid var(--ln);background:#fff;padding:4px}
.frm4{display:grid;grid-template-columns:110px 150px 150px 1fr;gap:8px 12px}.frm4 label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}.frm4 .full{grid-column:1/-1}.frm4 input{width:100%}
.srow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;padding-top:10px;border-top:1px solid #e4ecf6}
.srow2 .sepv{width:1px;height:24px;background:var(--ln);margin:0 6px}
label.f.inl{flex-direction:row;align-items:center;gap:6px;margin:0 6px 0 0}
.spsec{border:1px solid var(--ln);border-radius:12px;margin:12px 0;background:#fbfdff;scroll-margin-top:72px}
.sh{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#eaf2fb;border-bottom:1px solid var(--ln);border-radius:12px 12px 0 0}
.sh button{margin:0}
.sn{font:700 17px Georgia,serif;color:var(--or);flex:none;padding-left:4px}
.sh input.st{font:600 17px Georgia,serif;color:var(--b2);border-color:transparent;background:transparent;flex:1;min-width:180px}.sh input.st:hover,.sh input.st:focus{border-color:var(--ln);background:#fff}
.blist{padding:4px 12px}
.brow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed #d3e0ef;scroll-margin-top:80px;border-radius:8px}
.brow:last-child{border-bottom:0}
.bic{font-size:20px;text-align:center;line-height:30px}
.bname{font-weight:600;color:var(--b2);font-size:14.5px}.bname small{font-weight:400;color:var(--mut);margin-left:8px;font-size:12.5px}
.bset{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 8px;margin-top:8px;padding:8px 10px;background:#fff;border:1px solid #dfe8f3;border-radius:9px}.bset label.f{margin:0}.bset label.ck{margin:0 4px 4px 0}.bset .grow2{flex:1 1 220px}.bset .grow2 input{width:100%}.bset button{margin-bottom:2px}
.bset .hint{margin:0}
.bact{display:flex;gap:3px;align-items:center;justify-content:flex-end;white-space:nowrap}.bact button{margin:0}.bact select{font-size:12px;padding:3px 4px;max-width:125px}.bact .gear.on{background:var(--b);color:#fff;border-color:var(--b)}
.bempty{color:var(--mut);font-style:italic;padding:10px 4px;font-size:13.5px}
.badd{padding:4px 12px 12px}.badd select{font-size:13px;color:var(--b2);border-style:dashed;background:#fff}
.addsec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}.addsec button{margin:0}.addsec .hint{display:inline;margin:0 4px}
.addsec .pri{font-size:14px;padding:7px 14px}.qsw{display:inline-flex;gap:4px}.qsw select{font-size:13px;padding:3px 4px}
.flash{animation:fl 1.8s ease-out}@keyframes fl{0%,35%{background:#fff3b0;box-shadow:0 0 0 3px #f2d64b}100%{}}
/* ---------- ③ contenuti e anteprima ---------- */
.app{display:flex;gap:18px;max-width:1240px;margin:auto;padding:16px;position:relative}
aside.nav{width:210px;flex:none;position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 76px);overflow:auto;background:#ffffffe6;border:1px solid var(--ln);border-radius:12px;padding:10px}
.navh{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:2px 6px 6px}
button.lnk{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;margin:1px 0;border-radius:7px;color:var(--b);font-size:14px;line-height:1.3}button.lnk:hover{background:#e6effa}
button.lnk.in{display:inline;width:auto;padding:0;font-size:inherit;font-weight:600;text-decoration:underline}
aside.nav .hint{margin:12px 6px 2px;font-size:12px;line-height:1.45;border-top:1px solid var(--ln);padding-top:10px}
main{flex:1;min-width:0}
.hd{display:flex;gap:16px;align-items:center;color:#fff;border-radius:14px;padding:16px 20px;position:relative;overflow:hidden;scroll-margin-top:72px}
.hd>svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}.hd>:not(svg){position:relative;z-index:1}
.hd img{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.hd h1{margin:0;font:700 27px Georgia,"Times New Roman",serif;letter-spacing:.5px}.hd p{margin:3px 0 0}.hd .s{font-size:12px;opacity:.88}
.sec{margin-top:24px;scroll-margin-top:72px}.sec h2{font:600 21px Georgia,serif;color:var(--b2);border-left:6px solid var(--b);padding-left:10px;margin:0 0 10px;break-after:avoid}
.blk{background:#fff;border:1px solid #d6e2f1;border-radius:12px;padding:12px 16px;margin-bottom:12px;position:relative}
.blk.ed{box-shadow:0 0 0 2px #5b8dd066}
.blk>h3{margin:0 40px 6px 0;font-size:15.5px;color:var(--b2);letter-spacing:.01em}
.blk h4{margin:12px 0 4px;font-size:13px;color:var(--b);text-transform:uppercase;letter-spacing:.06em}
.blk>.tools{position:absolute;top:8px;right:8px;z-index:22}
.pen{border-radius:50%;width:30px;height:30px;padding:0;text-align:center;margin:0}.pen.on{background:var(--b);color:#fff;border-color:var(--b)}
.edit{background:var(--soft);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;margin:0 36px 10px 0}
.edit .hint{margin:0 0 6px}.edrow{margin-top:6px}td.rowb{white-space:nowrap;background:none!important}
.txtb.ed .rt{margin-right:38px}
/* tabelle: stile minimal (predefinito) */
.tw{overflow:auto;margin-top:4px}table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{background:transparent;color:var(--b2);text-align:left;padding:6px 10px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--b)}
td{padding:6px 10px;border:0}tr{break-inside:avoid}
tbody tr:nth-child(even) td{background:#1d4f910b}
th.n,td.n{text-align:center}td.c{white-space:nowrap}
td.pos{color:var(--b);font-weight:700;width:36px}
td.pts{font-weight:800;color:var(--b2);background:#1d4f9116!important}th.pts{background:#1d4f9116}
.lg{height:22px;width:22px;object-fit:contain;vertical-align:middle;margin-right:8px}
tr.rec td,tbody tr.rec:nth-child(even) td{background:var(--y)!important}
.rb{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--yb);color:#3a2f00;border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:middle}
.res{display:inline-block;min-width:58px;padding:2px 10px;border-radius:999px;background:#1d4f9114;color:var(--b2);font-weight:700;white-space:nowrap;text-align:center}
.pos{color:var(--mut);font-size:11px;margin-left:4px}
td small{display:block;color:var(--mut);font-size:11px;line-height:1.2}
/* tabelle: stile classico */
body.tclassic th{background:var(--b);color:#fff;font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;border:0;padding:5px 9px}
body.tclassic td{border-bottom:1px solid var(--ln);padding:4px 9px}body.tclassic tbody tr:nth-child(even) td{background:#1d4f9111}
body.tclassic .res{background:none;padding:0;min-width:0}body.tclassic td.pts{background:none!important}body.tclassic th.pts{background:var(--b)}
.empty{color:var(--mut);font-style:italic;margin:6px 0}
.txt{min-height:1.4em}.txt p{margin:.4em 0}.txt h3{margin:.5em 0 .3em;color:var(--b2);font:600 18px Georgia,serif}.txt h4{margin:.5em 0 .3em;color:var(--b);text-transform:none;letter-spacing:0;font-size:15px}
.txt blockquote{margin:.5em 0;padding:4px 12px;border-left:4px solid var(--b);background:#1d4f910d;font-style:italic}
[contenteditable=true]{outline:1px dashed #5b8dd0;background:#fff;border-radius:3px;min-width:1.6em;display:inline-block}.txt[contenteditable=true]{display:block;padding:6px 8px}
th [contenteditable=true]{color:var(--ink)}
.idx{background:#fff;border:1px solid #d6e2f1;border-radius:12px;padding:10px 16px;margin-top:14px}.idx h3{margin:0 0 6px;color:var(--b2);font:600 16px Georgia,serif}
.idx a{display:block;color:var(--or);text-decoration:none;font-weight:600;padding:2px 0}.idx a .n{display:inline-block;min-width:22px;color:var(--or)}.idx a:hover{text-decoration:underline}.idx .pg{float:right;color:var(--mut);font-weight:500}
.hd .hn,.hd .chips,.ic{display:none}
.runh,.cframe{display:none}.chap{display:contents}
.sech .sn{font:inherit;color:inherit;padding:0}.hd .m3{white-space:nowrap}#doc .empty .po{display:none}
.contl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
/* ---------- editor testo ---------- */
.rt{position:sticky;top:60px;z-index:20;display:flex;flex-wrap:wrap;gap:1px;align-items:center;background:var(--soft);border:1px solid var(--ln);border-radius:9px;padding:4px;margin:0 0 6px}
.rt button{min-width:30px;height:30px;margin:0;padding:0 7px;border-color:transparent;background:transparent;font-size:14px}.rt button:hover{background:#dce8f8;border-color:var(--ln)}
.rt .sep{width:1px;height:22px;background:var(--ln);margin:0 4px}
.pw{position:relative;display:inline-block}
.pop{position:absolute;top:34px;left:0;z-index:40;background:#fff;border:1px solid var(--ln);border-radius:10px;box-shadow:0 10px 28px #0f346633;padding:8px;min-width:150px}
.pop[hidden]{display:none}.pop .grid{display:grid;grid-template-columns:repeat(6,26px);gap:5px}
.pop .sw{width:26px;height:26px;min-width:0;border-radius:6px;border:1px solid #0003;padding:0}
.pop .li button{display:block;width:100%;text-align:left;height:auto;padding:5px 8px}
.pop .cust{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--mut)}.pop .cust input{padding:0;width:40px;height:26px}
/* ---------- social e QR ---------- */
.intro{margin:2px 0 10px}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px}
.sc{flex:1 1 0;display:block;border:1px solid #d6e2f1;border-top:5px solid var(--c);border-radius:12px;background:#fff;padding:12px 10px;text-align:center;break-inside:avoid;color:var(--ink);text-decoration:none}
.sc .pl{font-weight:700;color:var(--c);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.sc .qr{margin:8px auto 6px}.sc .qr svg{width:100%;height:100%;display:block}
.sc .hn{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}.sc .u{font-size:10.5px;color:var(--mut);overflow-wrap:anywhere}
.q-l .sc{min-width:210px;max-width:290px}.q-l .qr{width:170px;height:170px}.q-l .hn{font-size:15px}
.q-m .sc{min-width:160px;max-width:215px}.q-m .qr{width:128px;height:128px}
.q-s .sc{min-width:118px;max-width:150px;padding:10px 8px}.q-s .qr{width:92px;height:92px}.q-s .pl{font-size:11.5px}.q-s .hn{font-size:12.5px}
.noqr .sc{flex:1 1 0;min-width:150px;max-width:240px}
.srow{display:grid;grid-template-columns:130px 1fr 1.4fr auto;gap:6px;margin:4px 0;align-items:center}
/* ---------- collaboratori ---------- */
.recruit{border:2px dashed var(--b);border-radius:16px;padding:18px 20px;background:linear-gradient(135deg,#ffffff,#e6effb);text-align:center;break-inside:avoid}
.recruit .hl{font:italic 600 22px Georgia,serif;color:var(--b2);margin:0 0 10px;display:block}
.recruit .ql{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
.roles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}.roles span{background:var(--b);color:#fff;border-radius:999px;padding:4px 13px;font-size:13.5px}
.recruit .ct{font-size:14px}
/* ---------- sponsor ---------- */
.spg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
.spg .sp{flex:0 0 calc((100% - (var(--cols) - 1) * 10px) / var(--cols));border:1px solid #dfe8f3;border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;break-inside:avoid}
.spg.grid .sp{max-width:300px}.spg.cards .sp{max-width:420px;padding:12px}
.sp .logo{width:100%;aspect-ratio:3/2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.spg.cards .sp .logo{aspect-ratio:16/10}
.sp .logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.sp .logo span{font-weight:700;color:var(--b2);font-size:15px;padding:6px}
.sp .nm{font-weight:700;font-size:12.5px;color:var(--b2);line-height:1.25}.spg.cards .sp .nm{font-size:16px}
.sp .tx{font-size:13px;white-space:pre-line}.sp .tx.sm{font-size:11px;color:var(--mut)}
.sp .qrs{width:64px;height:64px}.sp .qrs svg{width:100%;height:100%}
.sp .u{font-size:11px;color:var(--mut);overflow-wrap:anywhere}
.spfull .spg.cards .sp .logo{aspect-ratio:4/3}
.sptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.sptop .hint{margin:0}
.sphead,.spe{display:grid;grid-template-columns:66px 1fr 1fr 1.3fr auto;gap:6px;align-items:center}
.sphead{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
.spe{background:#fff;border:1px solid #e1e9f4;border-radius:8px;padding:5px;margin:4px 0}.spe input{width:100%;min-width:0}
.spe .th{width:66px;height:44px;border:1px dashed var(--ln);border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--mut);cursor:pointer;background:#fff}
.spe .th img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:contain}.spb2{white-space:nowrap}.spb2 button{margin:0;padding:3px 7px}
ol.tip{padding-left:20px;font-size:14px}ol.tip li{margin:6px 0}
/* ---------- anteprima a pagina e pagine A4 ---------- */
#doc{width:794px;max-width:100%;margin:0 auto;padding:45px;background-color:var(--pbg);background-image:var(--wmimg,none);background-repeat:repeat-y;background-size:794px 1123px;background-position:center top;border-radius:4px;box-shadow:0 6px 28px #0f346626}
.sech{font:600 21px Georgia,serif;color:var(--or);border-left:6px solid var(--b);padding-left:10px;margin:24px 0 10px;scroll-margin-top:72px}
.pbr{display:flex;align-items:center;gap:10px;margin:8px -45px 18px;color:#6f85a3;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.pbr::before,.pbr::after{content:"";flex:1;border-top:2px dashed #8fa9c9}
.splitw{margin-top:8px;padding:6px 10px;border-radius:8px;background:#fff4d6;border:1px solid #f0cf6b;color:#6b5200;font-size:12.5px}
aside.nav .pcount{margin:10px 6px 0;font-size:12.5px;font-weight:600;color:var(--b2)}
#pagesbox{position:absolute;left:-30000px;top:0;width:794px}
.page{width:794px;height:1123px;position:relative;overflow:hidden;background-color:var(--pbg);background-image:var(--wmimg,none);background-repeat:no-repeat;background-size:794px 1123px;margin:0}
.pin{position:absolute;left:45px;top:45px;width:704px}
.pin>:first-child{margin-top:0!important}
.pfoot{position:absolute;left:45px;right:45px;bottom:16px;display:flex;justify-content:space-between;font:9px "Segoe UI",system-ui,sans-serif;color:#6b7c93}
.page .nt{display:none!important}
/* ---------- finestre ---------- */
dialog{border:1px solid var(--ln);border-radius:14px;max-width:640px;width:94%;padding:18px 20px;color:var(--ink)}
dialog::backdrop{background:#0f346655}
dialog h3{margin:0 0 8px;color:var(--b2);font:600 20px Georgia,serif}
.lgl>div{display:flex;align-items:center;gap:10px;margin:4px 0}.lgl span:nth-child(2){flex:1}
.lgi{width:30px;height:30px;border:1px solid var(--ln);border-radius:6px;display:inline-flex;align-items:center;justify-content:center}.lgi img{max-width:26px;max-height:26px}
.lst{max-height:46vh;overflow:auto;border:1px solid var(--ln);border-radius:10px;margin:8px 0}
.lst>div{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--ln);flex-wrap:wrap}.lst>div:last-child{border-bottom:0}
.lst .gr{flex:1;min-width:160px}.lst .gr small{display:block;color:var(--mut);font-size:12px}
.badge{font-size:11px;border-radius:5px;padding:1px 6px;background:#e3edfa;color:var(--b2);font-weight:600}.badge.adm{background:var(--b2);color:#fff}.badge.off{background:#f6d5d2;color:var(--ko)}
.opt3{display:grid;gap:8px;margin:10px 0}.opt3 button{text-align:left;padding:10px 12px;font-size:14px}.opt3 button small{display:block;color:var(--mut);font-size:12px}
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;margin:8px 0}.frm label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
.right{text-align:right;margin-top:10px}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:8px}
#toast div{background:var(--b2);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px #0f346655;max-width:380px;animation:tin .2s ease-out}
#toast div.err{background:var(--ko)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
/* ---------- accesso ---------- */
#gate{position:fixed;inset:0;z-index:150;background:linear-gradient(140deg,var(--b2),var(--b));display:grid;place-items:center;padding:16px}
#gate[hidden]{display:none}
.gc{background:#fff;border-radius:18px;padding:26px 26px 20px;width:min(390px,100%);box-shadow:0 20px 50px #0007;text-align:center}
.gc img{width:86px;height:86px;object-fit:contain}.gc h2{margin:6px 0 2px;font:600 22px Georgia,serif;color:var(--b2)}
.gc input{width:100%;margin:5px 0;padding:9px 10px}.gc .big{margin-top:8px}.gc a{font-size:13px;color:var(--b);cursor:pointer}
.gc .gm{font-size:13px;margin:8px 0;color:var(--ko);white-space:pre-line}.gc .gm.ok{color:var(--ok)}
@media screen and (max-width:900px){.app{flex-wrap:wrap}aside.nav{width:100%;position:static;max-height:none}.cols2{grid-template-columns:1fr}.stat{grid-template-columns:repeat(2,1fr)}.srow{grid-template-columns:1fr 1fr}.tabs{margin-left:0}.frm4{grid-template-columns:1fr 1fr}.brow{grid-template-columns:28px 1fr}.bact{grid-column:2;justify-content:flex-start;max-width:none}.spg .sp{flex-basis:calc((100% - 10px)/2)}.sphead{display:none}.spe{grid-template-columns:66px 1fr 1fr}}
@media print{@page{size:A4;margin:0}
 html,body{background:#fff!important;margin:0}
 body>*:not(#pagesbox){display:none!important}
 #pagesbox{position:static!important;left:auto!important;width:auto}
 .page{break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}
}

/* ================= STILI GRAFICI (temi) ================= */
/* comuni a tutti i temi nuovi */
:is(.th-soft,.th-clean,.th-sport) :is(#doc,.page){background-image:none!important;font-size:14px;line-height:1.5;color:var(--t-ink)}
:is(.th-soft,.th-clean,.th-sport) .hd>svg.bg{display:none}
:is(.th-soft,.th-clean,.th-sport) .hd .m{display:none}
:is(.th-soft,.th-clean,.th-sport) :is(.sech,.idx) .sd{display:none}
:is(.th-soft,.th-clean,.th-sport) .idx a .n{min-width:0}
:is(.th-soft,.th-clean,.th-sport) .idx .pg{float:none}
:is(.th-soft,.th-clean,.th-sport) .ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
:is(.th-soft,.th-clean,.th-sport) .blk>h3{display:flex;align-items:center;gap:10px;margin:0 40px 10px 0}
:is(.th-soft,.th-clean,.th-sport) .txt :is(p,div):has(>br:only-child){margin:0;line-height:.6}
:is(.th-soft,.th-clean,.th-sport) .txt p{margin:.3em 0}
:is(.th-soft,.th-clean,.th-sport) .empty{font-style:normal;font-size:13px;color:var(--t-mut);margin:2px 0}
:is(.th-soft,.th-clean,.th-sport) tbody tr:nth-child(even) td{background:none}
:is(.th-soft,.th-clean,.th-sport) td small{color:var(--t-mut)}
:is(.th-soft,.th-clean,.th-sport) span.pos{color:var(--t-mut);font-size:11px}
:is(.th-soft,.th-clean,.th-sport) .lv-recuperi tr.rec td{background:none!important}
:is(.th-soft,.th-clean,.th-sport) .lv-recuperi td:nth-child(4) b{color:var(--t-or2)}
/* risultati e prossimo turno: righe "partita" invece della tabella */
:is(.th-soft,.th-clean,.th-sport) :is(.lv-risultati,.lv-prossima) :is(table,tbody){display:block}
:is(.th-soft,.th-clean,.th-sport) :is(.lv-risultati,.lv-prossima) thead{display:none}
:is(.th-soft,.th-clean,.th-sport) :is(.lv-risultati,.lv-prossima) tr:nth-child(n) td{padding:0;border:0;background:none!important}
:is(.th-soft,.th-clean,.th-sport) .blk.nodata{display:flex;align-items:center;flex-wrap:wrap;column-gap:14px;row-gap:4px}
:is(.th-soft,.th-clean,.th-sport) .blk.nodata>h3{margin:0}
:is(.th-soft,.th-clean,.th-sport) .blk.nodata>.empty{margin:0 0 0 auto}
:is(.th-soft,.th-clean,.th-sport) #doc .blk.nodata>.empty{margin-right:40px}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati tr{display:grid;grid-template-columns:64px 1fr 84px 1fr;align-items:center;column-gap:12px}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(1){font-size:12px;color:var(--t-mut);font-weight:600}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(2){text-align:right;font-weight:600}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(3){text-align:center}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(4){font-weight:600}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(3) .rb{margin:0}
:is(.th-soft,.th-clean,.th-sport) .lv-risultati td:nth-child(1) .rb{margin-left:4px}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima tr{display:grid;grid-template-columns:76px 1fr 1fr;grid-template-areas:"d h a" "d c c";column-gap:12px;row-gap:2px;align-items:center}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(1){grid-area:d;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;line-height:1.25}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(1) .rb{margin:3px 0 0}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(2){grid-area:c;font-size:12px;color:var(--t-mut)}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(2) b{color:var(--t-ink)}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(2) small{display:inline;font-size:12px;margin-left:4px}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(2) small::before{content:"· "}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(3){grid-area:h;font-weight:600}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(4){grid-area:a;font-weight:600}
:is(.th-soft,.th-clean,.th-sport) .lv-prossima td:nth-child(4)::before{content:"vs";color:var(--t-or);font-weight:800;font-size:12px;margin-right:8px}
:is(.th-soft,.th-clean,.th-sport) .recruit .roles{margin-bottom:10px}

/* ---------- 1 · CARD MORBIDE ---------- */
.th-soft{--t-ink:#16263f;--t-navy:#0f2f5c;--t-blue:#1d4f91;--t-or:#d4600a;--t-or2:#b95300;--t-mut:#64768e;--t-line:#e6ecf4;--t-tint:#f3f6fb;--t-ortint:#fff1e1}
.th-soft :is(#doc,.page){background-color:#ebf1f9!important;font-family:Manrope,"Segoe UI",system-ui,sans-serif}
.th-soft .hd{background:#fff;color:var(--t-ink);border-radius:20px;padding:18px 22px;gap:18px;box-shadow:0 1px 2px #0f2f5c0f}
.th-soft .hd img{width:72px;height:72px;padding:0;background:none;border-radius:0}
.th-soft .hd h1{font:800 22px/1.15 Manrope,sans-serif;letter-spacing:-.01em;color:var(--t-navy)}
.th-soft .hd .s{font-size:11px;color:var(--t-mut);opacity:1;margin-top:4px}
.th-soft .hd .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.th-soft .hd .chips span{background:var(--t-tint);color:var(--t-navy);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700}
.th-soft .hd .chips .c1{background:var(--t-or2);color:#fff}
.th-soft .idx{background:#fff;border:0;border-radius:20px;padding:14px 22px 10px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;box-shadow:0 1px 2px #0f2f5c0f}
.th-soft .idx h3{grid-column:1/-1;font:800 10px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--t-mut);margin:2px 0 6px}
.th-soft .idx a{display:flex;align-items:baseline;gap:10px;padding:6px 0;color:var(--t-or);font-weight:700;font-size:14px;border-top:1px solid var(--t-line)}
.th-soft .idx a .n{color:var(--t-navy);font-weight:800;width:14px}
.th-soft .idx a .pg{margin-left:auto;color:var(--t-mut);font-size:12px;font-weight:600}
.th-soft .sech{display:flex;align-items:center;gap:10px;font:800 20px/1.2 Manrope,sans-serif;color:var(--t-or);border:0;padding:0;margin:24px 0 12px}
.th-soft .sech .sn{color:var(--t-navy)}
.th-soft .sech::after{content:"";flex:1;height:1px;background:#cad7e8;margin-left:6px}
.th-soft .blk{background:#fff;border:0;border-radius:18px;padding:15px 20px;margin-bottom:12px;box-shadow:0 1px 2px #0f2f5c0f}
.th-soft .blk.nodata{padding-top:10px;padding-bottom:10px}
.th-soft .blk>h3{font:800 15px/1.2 Manrope,sans-serif;color:var(--t-navy)}
.th-soft .ic{width:30px;height:30px;border-radius:10px;background:#e6eefa;color:var(--t-blue)}
.th-soft .ic svg{width:17px;height:17px}
.th-soft .blk h4{font:800 10px Manrope,sans-serif;letter-spacing:.14em;color:var(--t-mut);margin:12px 0 4px}
.th-soft th{background:none;color:var(--t-mut);font-size:10px;font-weight:800;letter-spacing:.12em;border-bottom:1px solid var(--t-line);padding:6px 8px}
.th-soft td{padding:7px 8px;border-bottom:1px solid #f0f4f9;font-size:13px}
.th-soft tbody tr:last-child td{border-bottom:0}
.th-soft td.pos{color:var(--t-mut);font-weight:700;width:30px}
.th-soft tbody tr:first-child td.pos{color:var(--t-or)}
.th-soft td.pts,.th-soft th.pts{background:#f0f5fc!important;color:var(--t-navy)}
.th-soft td.pts{font-weight:800;font-size:14px}
.th-soft tr.rec td{background:var(--t-ortint)!important}
.th-soft .rb{background:var(--t-or2);color:#fff;border-radius:999px;font-size:9px;font-weight:800;padding:1px 7px;letter-spacing:.06em}
.th-soft .res{background:var(--t-navy);color:#fff;border-radius:9px;padding:3px 10px;font-weight:800;min-width:62px}
.th-soft .lv-risultati tr{padding:9px 14px;margin-top:6px;border-radius:12px;background:var(--t-tint)}
.th-soft .lv-risultati tr.rec{background:var(--t-ortint)}
.th-soft .lv-prossima tr{padding:8px 14px 8px 8px;margin-top:6px;border-radius:12px;background:var(--t-tint)}
.th-soft .lv-prossima tr.rec{background:var(--t-ortint)}
.th-soft .lv-prossima tr:nth-child(n) td:nth-child(1){background:#fff!important;border-radius:9px;padding:6px 4px;color:var(--t-navy)}
.th-soft .intro{font-size:13px;color:var(--t-mut)}
.th-soft .sc{border:0;border-radius:14px;background:var(--t-tint);padding:12px 10px}
.th-soft .sc .pl{font-size:10px;font-weight:800;letter-spacing:.14em}
.th-soft .sc .qr{background:#fff;border-radius:10px;padding:6px}
.th-soft .sc .hn{font-size:13px;font-weight:700}
.th-soft .spg .sp{border:0;background:var(--t-tint);border-radius:14px}
.th-soft .spg.grid .sp{max-width:190px}
.th-soft .recruit{border:0;border-radius:16px;background:var(--t-navy);color:#fff;padding:22px 24px}
.th-soft .recruit .hl{font:italic 800 20px/1.3 Manrope,sans-serif;color:#fff}
.th-soft .recruit .ql{color:#ffffffb3;font-size:10px;font-weight:800;letter-spacing:.16em}
.th-soft .roles span{background:#fff;color:var(--t-navy);font-weight:700;font-size:12px;padding:4px 13px}
.th-soft .recruit .ct{color:#ffffffd9;font-size:13px}
.th-soft .pfoot{font:600 10px Manrope,sans-serif;color:var(--t-mut);bottom:16px;align-items:center}
.th-soft .pfoot span:last-child{background:#fff;border-radius:999px;padding:2px 10px;color:var(--t-navy);font-weight:800}
.th-soft .contl{font:800 10px Manrope,sans-serif;letter-spacing:.14em;color:var(--t-mut);margin-bottom:8px}

/* ---------- 2 · MINIMAL PULITO ---------- */
.th-clean{--t-ink:#18263b;--t-navy:#0f2f5c;--t-blue:#1d4f91;--t-or:#d4600a;--t-or2:#b95300;--t-mut:#66768b;--t-line:#e3e8ef;--t-tint:#f5f7fa;--t-ortint:#fff4e8}
.th-clean :is(#doc,.page){background-color:#ffffff!important;font-family:Figtree,"Segoe UI",system-ui,sans-serif}
.th-clean .hd{background:none;color:var(--t-ink);border-radius:0;padding:0 0 16px;gap:16px;border-bottom:2px solid var(--t-navy);overflow:visible}
.th-clean .hd::after{content:"";position:absolute;left:0;bottom:-2px;width:72px;height:2px;background:var(--t-or)}
.th-clean .hd img{width:66px;height:66px;padding:0;background:none;border-radius:0}
.th-clean .hd h1{font:800 23px/1.15 Figtree,sans-serif;letter-spacing:-.01em;color:var(--t-navy)}
.th-clean .hd .s{font-size:12px;color:var(--t-mut);opacity:1;margin-top:3px}
.th-clean .hd .chips{display:block;margin:2px 0 0;font-size:12px;color:var(--t-mut)}
.th-clean .hd .chips :is(.c1,.c2){display:none}
.th-clean .hd .hn{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto;line-height:1}
.th-clean .hd .hn small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--t-mut)}
.th-clean .hd .hn b{font-size:44px;font-weight:800;color:var(--t-navy);margin:2px 0 4px}
.th-clean .hd .hn span{font-size:12px;font-weight:600;color:var(--t-or2)}
.th-clean .idx{background:none;border:0;border-radius:0;padding:0;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.th-clean .idx h3{grid-column:1/-1;font:700 10px/1 Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--t-mut);margin:0 0 6px}
.th-clean .idx a{display:flex;align-items:baseline;gap:8px;padding:4px 0;color:var(--t-or);font-weight:700;font-size:14px}
.th-clean .idx a .n{color:var(--t-navy);font-weight:400;width:14px}
.th-clean .idx a::after{content:"";flex:1;order:2;border-bottom:1px dotted #b6c1d0;transform:translateY(-4px)}
.th-clean .idx a .t{order:1}
.th-clean .idx a .pg{order:3;color:var(--t-navy);font-weight:700;font-size:13px}
.th-clean .sech{display:flex;align-items:baseline;gap:10px;font:800 22px/1.2 Figtree,sans-serif;color:var(--t-or);border:0;border-bottom:1px solid var(--t-line);padding:0 0 8px;margin:28px 0 14px}
.th-clean .sech .sn{color:var(--t-navy);font-weight:400}
.th-clean .blk{background:none;border:0;border-radius:0;padding:0;margin:0 0 18px;box-shadow:none}
.th-clean .blk+.blk{border-top:1px solid var(--t-line);padding-top:16px}
.th-clean .blk.nodata{margin-bottom:10px}.th-clean .blk.nodata+.blk.nodata{padding-top:10px}
.th-clean .blk>h3{gap:8px;font:700 15px/1.2 Figtree,sans-serif;color:var(--t-navy)}
.th-clean .ic{color:var(--t-or)}
.th-clean .ic svg{width:17px;height:17px}
.th-clean .blk h4{font:700 10px Figtree,sans-serif;letter-spacing:.14em;color:var(--t-mut);margin:12px 0 4px}
.th-clean th{background:none;color:var(--t-mut);font-size:10px;font-weight:700;letter-spacing:.12em;border-bottom:1px solid #cdd5e0;padding:5px 8px}
.th-clean td{padding:6px 8px;border-bottom:1px solid #eef1f5;font-size:13px}
.th-clean tbody tr:last-child td{border-bottom:0}
.th-clean td.pos{color:var(--t-mut);font-weight:600;width:30px}
.th-clean tbody tr:first-child td.pos{color:var(--t-or2);font-weight:800}
.th-clean td.pts,.th-clean th.pts{background:none!important;color:var(--t-navy)}
.th-clean td.pts{font-weight:800;font-size:14px}
.th-clean tr.rec td{background:var(--t-ortint)!important}
.th-clean tr.rec td:first-child{box-shadow:inset 3px 0 0 var(--t-or)}
.th-clean .rb{background:none;color:var(--t-or2);border:1px solid var(--t-or);border-radius:4px;font-size:9px;font-weight:700;padding:0 5px;letter-spacing:.06em}
.th-clean .res{background:none;color:var(--t-navy);padding:0;font-weight:800;font-size:16px;min-width:0}
.th-clean .lv-risultati tr{padding:8px 0;border-bottom:1px solid var(--t-line)}
.th-clean .lv-risultati tr:last-child{border-bottom:0}
.th-clean .lv-risultati tr.rec{background:var(--t-ortint);box-shadow:inset 3px 0 0 var(--t-or);padding-left:12px;padding-right:8px}
.th-clean :is(.lv-recuperi,.lv-risultati,.lv-prossima) tr.rec td:first-child{box-shadow:none}
.th-clean .lv-prossima tr{padding:8px 0;border-bottom:1px solid var(--t-line)}
.th-clean .lv-prossima tr:last-child{border-bottom:0}
.th-clean .lv-prossima tr.rec{background:var(--t-ortint);box-shadow:inset 3px 0 0 var(--t-or)}
.th-clean .lv-prossima tr:nth-child(n) td:nth-child(1){color:var(--t-navy);align-items:flex-start;text-align:left;padding-left:12px}
.th-clean .intro{font-size:13px;color:var(--t-mut)}
.th-clean .sc{border:1px solid var(--t-line);border-top:3px solid var(--c);border-radius:10px;background:#fff}
.th-clean .sc .pl{font-size:10px;font-weight:700;letter-spacing:.14em}
.th-clean .sc .hn{font-size:13px}
.th-clean .spg .sp{border:1px solid var(--t-line);border-radius:10px;background:#fff}
.th-clean .spg.grid .sp{max-width:180px}
.th-clean .recruit{border:0;border-left:3px solid var(--t-or);border-radius:0;background:var(--t-tint);text-align:left;padding:16px 22px}
.th-clean .recruit .hl{font:italic 700 20px/1.3 Figtree,sans-serif;color:var(--t-navy)}
.th-clean .recruit .ql{color:var(--t-mut);font-size:10px;font-weight:700;letter-spacing:.16em}
.th-clean .roles{justify-content:flex-start}
.th-clean .roles span{background:#fff;color:var(--t-navy);border:1px solid #c3cedc;font-weight:600;font-size:12px}
.th-clean .recruit .ct{font-size:13px;color:var(--t-ink)}
.th-clean .pfoot{font:500 10px Figtree,sans-serif;color:var(--t-mut);border-top:1px solid var(--t-line);padding-top:6px;bottom:14px}
.th-clean .pfoot span:last-child{color:var(--t-navy);font-weight:700}

.th-sport .hd h1{font:700 30px/1.05 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;color:#fff}

.th-sport .idx{background:none;border:0;border-radius:0;padding:0;margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:20px}

 if(/email-already-in-use/.test(c))return'Esiste già un account con questa email.';
 if(/weak-password/.test(c))return'La password deve avere almeno 6 caratteri.';
 if(/user-disabled/.test(c))return'Questo account è stato disattivato.';
 if(/permission-denied|insufficient/.test(c))return'Permesso negato da Firestore: controlla le regole di sicurezza (GUIDA_FIREBASE.md, passo 4).';
 if(/operation-not-allowed/.test(c))return'Accesso con email/password non attivo: abilitalo in Firebase (GUIDA_FIREBASE.md, passo 2).';
 if(/api-key|invalid-api-key/.test(c))return'Configurazione Firebase non valida: ricontrolla FIREBASE_CONFIG.';
 return(x&&x.message)||String(x)}
function gate(inner){const G=$('#gate');G.hidden=false;G.innerHTML=`<div class="gc"><img src="${S.lega||LEGA}" alt=""><h2>Comunicati LACT</h2><div style="font-size:13px;color:var(--mut);margin-bottom:12px">Lega Amatori Calcio Treviso</div>${inner}</div>`}
function loginForm(m,ok,em){gate(`<form id="lf"><input id="le" type="email" placeholder="Email" autocomplete="username" required value="${esc(em||'')}"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" required><button class="big" type="submit">Accedi</button></form><div class="gm${ok?' ok':''}">${esc(m||'')}</div><a data-a="reset">Password dimenticata?</a>`);
 $('#lf').onsubmit=async e=>{e.preventDefault();const bt=$('#lf button');bt.disabled=true;bt.textContent='Accesso…';const em=$('#le').value.trim();
  try{await FB.U.signInWithEmailAndPassword(FB.auth,em,$('#lp').value)}catch(x){loginForm(authErr(x),0,em)}};
 setTimeout(()=>{const i=$(em?'#lp':'#le');if(i)i.focus()},30)}
async function cloudInit(){if(!FIREBASE_CONFIG)return;gate('<p>Connessione in corso…</p>');
 try{const B=`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`,[A,U,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);FB={A,U,F,app,auth:U.getAuth(app),db:F.getFirestore(app),user:null,prof:null,msg:''};U.onAuthStateChanged(FB.auth,onUser)}
 catch(x){gate(`<p class="gm">Impossibile collegarsi a Firebase.\n${esc(x.message||x)}\n\nControlla la connessione a internet e ricarica la pagina.</p>`)}}
async function onUser(u){if(!u){FB.user=null;FB.prof=null;loginForm(FB.msg);FB.msg='';renderTop();return}
 gate('<p>Accesso in corso…</p>');const F=FB.F;
 try{const ref=F.doc(FB.db,'users',u.uid);let s=await F.getDoc(ref);
  if(!s.exists()&&SUPER_ADMIN_EMAIL&&(u.email||'').toLowerCase()==SUPER_ADMIN_EMAIL.toLowerCase()){await F.setDoc(ref,{email:u.email,name:'Amministratore',role:'admin',active:true,created:F.serverTimestamp()});s=await F.getDoc(ref)}
  if(!s.exists()||s.data().active===false){FB.msg='Questo account non è abilitato: chiedi all’amministratore della Lega.';await FB.U.signOut(FB.auth);return}
  FB.user=u;FB.prof=s.data();await cloudLoadShared();$('#gate').hidden=true;render();toast('Ciao '+(FB.prof.name||u.email)+'!')}
 catch(x){FB.msg=authErr(x);await FB.U.signOut(FB.auth).catch(()=>{})}}
async function cloudLogout(){if(!confirm('Uscire dall’account?'))return;await FB.U.signOut(FB.auth)}
async function cloudReset(){const em=($('#le')||{}).value||'';if(!em.trim()){loginForm('Scrivi la tua email nel campo qui sopra e poi clicca di nuovo “Password dimenticata?”.');return}
 try{await FB.U.sendPasswordResetEmail(FB.auth,em.trim());loginForm('Ti abbiamo inviato un’email per scegliere una nuova password (controlla anche lo spam).',1,em.trim())}catch(x){loginForm(authErr(x),0,em.trim())}}
async function cloudLoadShared(){const F=FB.F;try{const q=await F.getDocs(F.collection(FB.db,'logos'));FB.lk=new Set;q.forEach(d=>{const v=d.data();if(v&&v.data){S.logos[d.id]=v.data;FB.lk.add(d.id)}});
 const l=await F.getDoc(F.doc(FB.db,'settings','lega'));if(l.exists()&&l.data().data)S.lega=l.data().data;save()}catch(x){toast('Loghi condivisi non caricati: '+authErr(x),1)}}
async function cloudLogo(k,name,data){const F=FB.F;try{if(data){await F.setDoc(F.doc(FB.db,'logos',k),{name,data,by:FB.user.uid,at:F.serverTimestamp()});FB.lk&&FB.lk.add(k)}else{await F.deleteDoc(F.doc(FB.db,'logos',k));FB.lk&&FB.lk.delete(k)}}catch(x){toast('Logo non salvato online: '+authErr(x),1)}}
async function cloudLega(data){if(FB.prof.role!='admin'){toast('Logo della Lega cambiato solo su questo computer: per tutti lo cambia l’amministratore.');return}
 try{await FB.F.setDoc(FB.F.doc(FB.db,'settings','lega'),{data,at:FB.F.serverTimestamp()});toast('Logo della Lega aggiornato per tutti.')}catch(x){toast(authErr(x),1)}}
async function logoPush(){const miss=Object.keys(S.logos).filter(k=>!(FB.lk&&FB.lk.has(k)));for(const k of miss)await cloudLogo(k,k,S.logos[k]);toast(miss.length+' loghi condivisi con tutti gli utenti.');logosDlg()}
/* ----- preset ----- */
const presetData=()=>{const P=JSON.parse(JSON.stringify(S));delete P.logos;delete P.lega;return JSON.stringify(P)};
async function listPresets(){const F=FB.F,c=F.collection(FB.db,'presets');let docs;
 if(FB.prof.role=='admin')docs=(await F.getDocs(c)).docs;
 else{const[a,b]=await Promise.all([F.getDocs(F.query(c,F.where('owner','==',FB.user.uid))),F.getDocs(F.query(c,F.where('shared','==',true)))]);const m=new Map;[...a.docs,...b.docs].forEach(d=>m.set(d.id,d));docs=[...m.values()]}
 return docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>((y.updated&&y.updated.seconds)||0)-((x.updated&&x.updated.seconds)||0))}
async function cloudPresetGet(id){const s=await FB.F.getDoc(FB.F.doc(FB.db,'presets',id));return s.exists()?{id:s.id,...s.data()}:null}
function applyPreset(p,next){try{const o=JSON.parse(p.data),num=S.num;S=mig({...o,logos:S.logos,lega:S.lega});if(next){S.num=String((+num||0)+1);S.data=todayDots()}E={};save();render();toast('Preset “'+p.name+'” aperto.'+(next?' Comunicato n. '+S.num+'.':''))}catch(x){toast('Preset non valido.',1)}}
async function presetsDlg(){const D=$('#dlg');D.innerHTML='<h3>📁 Preset</h3><p>Caricamento…</p>';if(!D.open)D.showModal();
 try{PRESETS=await listPresets()}catch(x){D.innerHTML=`<h3>📁 Preset</h3><p class="gm">${esc(authErr(x))}</p><div class="right"><button data-a="dlgclose">Chiudi</button></div>`;return}
 const me=FB.user.uid,adm=FB.prof.role=='admin',def=localStorage.lact_defp,dt=p=>p.updated&&p.updated.toDate?p.updated.toDate().toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'';
 D.innerHTML=`<h3>📁 Preset</h3><p style="font-size:14px;margin:0">Un preset salva il comunicato com’è adesso (sezioni, testi fissi, social, sponsor, campionati, impostazioni) per ripartire sempre dallo stesso punto. ★ = preset usato da “Nuovo comunicato”.</p>
 <div class="frm" style="grid-template-columns:1fr auto auto;align-items:end"><label>Nome del nuovo preset<input id="pN" placeholder="es. Comunicato settimanale"></label><label class="ck"><input type="checkbox" id="pSh"> condiviso con tutti</label><button class="pri" data-a="psave">Salva il comunicato attuale</button></div>
 <div class="lst">${PRESETS.map(p=>`<div><div class="gr"><b>${esc(p.name)}</b> ${p.shared?'<span class="badge">condiviso</span>':''} ${def==p.id?'<span class="badge adm">★ predefinito</span>':''}<small>${esc(p.ownerName||'')} · ${dt(p)} · ${Math.round((p.size||0)/1024)} KB</small></div><button data-a="pload" data-id="${p.id}">Apri</button><button data-a="pdef" data-id="${p.id}" title="Usa questo preset per “Nuovo comunicato”">${def==p.id?'★':'☆'}</button>${p.owner==me||adm?`<button data-a="pover" data-id="${p.id}" title="Sostituisci con il comunicato attuale">Aggiorna</button><button class="dang" data-a="pdel" data-id="${p.id}" title="Elimina">🗑</button>`:''}</div>`).join('')||'<div><i>Nessun preset salvato.</i></div>'}</div><div class="right"><button data-a="dlgclose">Chiudi</button></div>`}
async function presetSave(id){const data=presetData(),size=new Blob([data]).size;if(size>950000){toast(`Preset troppo grande (${Math.round(size/1024)} KB, massimo circa 900): usa immagini sponsor più leggere.`,1);return}
 const F=FB.F;try{if(id)await F.updateDoc(F.doc(FB.db,'presets',id),{data,size,updated:F.serverTimestamp()});
  else{const n=$('#pN').value.trim();if(!n){toast('Dai un nome al preset.');$('#pN').focus();return}
   await F.addDoc(F.collection(FB.db,'presets'),{name:n,shared:$('#pSh').checked,owner:FB.user.uid,ownerName:FB.prof.name||FB.user.email,data,size,updated:F.serverTimestamp()})}
  toast('Preset salvato.');presetsDlg()}catch(x){toast(authErr(x),1)}}
async function presetDel(id){const p=PRESETS.find(x=>x.id==id);if(!p||!confirm(`Eliminare definitivamente il preset “${p.name}”?`))return;try{await FB.F.deleteDoc(FB.F.doc(FB.db,'presets',id));if(localStorage.lact_defp==id)localStorage.removeItem('lact_defp');presetsDlg()}catch(x){toast(authErr(x),1)}}
/* ----- utenti (solo admin) ----- */
const genPwd=()=>{const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(10));return[...r].map(n=>A[n%A.length]).join('')};
async function usersDlg(note){const D=$('#dlg');if(!note)D.innerHTML='<h3>👥 Utenti</h3><p>Caricamento…</p>';if(!D.open)D.showModal();let L;
 try{L=(await FB.F.getDocs(FB.F.collection(FB.db,'users'))).docs.map(d=>({id:d.id,...d.data()}))}catch(x){D.innerHTML=`<h3>👥 Utenti</h3><p class="gm">${esc(authErr(x))}</p><div class="right"><button data-a="dlgclose">Chiudi</button></div>`;return}
 L.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 D.innerHTML=`<h3>👥 Gestione utenti</h3>${note?`<div class="recf" style="display:block;margin-bottom:8px">${note}</div>`:''}
 <div class="lst">${L.map(u=>`<div><div class="gr"><b>${esc(u.name||'—')}</b> <span class="badge${u.role=='admin'?' adm':''}">${u.role=='admin'?'amministratore':'utente'}</span> ${u.active===false?'<span class="badge off">disattivato</span>':''}<small>${esc(u.email||'')}</small></div>${u.id==FB.user.uid?'<small>(sei tu)</small>':`<select data-urole="${u.id}"><option value="user"${u.role!='admin'?' selected':''}>Utente</option><option value="admin"${u.role=='admin'?' selected':''}>Amministratore</option></select><button data-a="uact" data-id="${u.id}" data-v="${u.active===false?1:0}">${u.active===false?'Riattiva':'Disattiva'}</button>`}<button data-a="ureset" data-email="${esc(u.email||'')}" title="Invia all’utente un’email per scegliere una nuova password">✉ Reset password</button></div>`).join('')}</div>
 <h4 style="margin:14px 0 2px;color:var(--b2)">Nuovo utente</h4><div class="frm"><label>Nome e cognome<input id="uN" placeholder="Mario Rossi"></label><label>Email<input id="uE" type="email" placeholder="mario@email.it"></label><label>Password provvisoria<input id="uP" value="${genPwd()}"></label><label>Ruolo<select id="uR"><option value="user">Utente (comunicati e preset)</option><option value="admin">Amministratore (pieni poteri)</option></select></label></div>
 <div class="right" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><small class="hint" style="text-align:left">Comunica tu email e password provvisoria: l’utente potrà cambiarla con “Password dimenticata?”.</small><span style="white-space:nowrap"><button data-a="dlgclose">Chiudi</button> <button class="pri" data-a="ucreate">Crea utente</button></span></div>`}
async function userCreate(){const n=$('#uN').value.trim(),em=$('#uE').value.trim(),pw=$('#uP').value,r=$('#uR').value;if(!n||!em||pw.length<6){toast('Compila nome, email e una password di almeno 6 caratteri.',1);return}
 const bt=$('[data-a=ucreate]');bt.disabled=true;bt.textContent='Creazione…';
 try{if(!FB.sec)FB.sec=FB.A.initializeApp(FIREBASE_CONFIG,'secondaria');const sa=FB.U.getAuth(FB.sec),cr=await FB.U.createUserWithEmailAndPassword(sa,em,pw);
  await FB.F.setDoc(FB.F.doc(FB.db,'users',cr.user.uid),{email:em,name:n,role:r,active:true,created:FB.F.serverTimestamp(),by:FB.user.uid});await FB.U.signOut(sa);
  usersDlg(`✓ Utente creato. Comunica questi dati a <b>${esc(n)}</b>:<br>${/^https?:/.test(location.href)?`Indirizzo: <b>${esc(location.origin+location.pathname)}</b> · `:''}Email: <b>${esc(em)}</b> · Password provvisoria: <b>${esc(pw)}</b>`)}
 catch(x){bt.disabled=false;bt.textContent='Crea utente';toast(x.code=='auth/email-already-in-use'?'Esiste già un account con questa email: se era disattivato, riattivalo dall’elenco.':authErr(x),1)}}
async function userSet(id,v){try{await FB.F.updateDoc(FB.F.doc(FB.db,'users',id),v);toast('Utente aggiornato.');usersDlg()}catch(x){toast(authErr(x),1)}}
async function userReset(em){if(!em)return;try{await FB.U.sendPasswordResetEmail(FB.auth,em);toast('Email per il reset della password inviata a '+em+'.')}catch(x){toast(authErr(x),1)}}

/* ---------------- avvio ---------------- */
$('#stadiList').innerHTML=Object.entries(STADI).map(([k,v])=>`<option value="${esc(k)}">${esc(v.l)}</option>`).join('');
if(!TAB)TAB=S.camps.length?'doc':'data';
render();cloudInit();
</script></body></html>
